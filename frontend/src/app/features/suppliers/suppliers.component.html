<div class="list-page-container suppliers-page">
    <!-- Header -->
    <div class="list-page-header">
        <div class="header-content">
            <h1 class="page-title">Supplier Management</h1>
            <p class="page-subtitle">Manage your suppliers and customers</p>
        </div>
        <div class="header-actions">
            <button mat-raised-button color="primary" *ngIf="canCreate" (click)="openCreateDialog()" class="add-button">
                <mat-icon>add</mat-icon>
                Add Supplier
            </button>
        </div>
    </div>

    <!-- Statistics Section (Admin/Accountant only) -->
    <div class="statistics-section" *ngIf="showStatistics">
        <app-supplier-stats [statistics]="statistics" [loading]="statisticsLoading" [error]="statisticsError"
            (retry)="retryLoadStatistics()">
        </app-supplier-stats>
    </div>

    <div class="list-page-card">
        <!-- Filters Section -->
        <div class="list-filters-section">
            <div class="filter-group-primary">
                <mat-form-field appearance="outline" class="search-field" color="primary">
                    <mat-label>Search</mat-label>
                    <input matInput [formControl]="searchControl" placeholder="Search by name, code, contact...">
                    <mat-icon matPrefix>search</mat-icon>
                    <button mat-icon-button matSuffix *ngIf="searchControl.value" (click)="clearSearch()"
                        matTooltip="Clear search" type="button">
                        <mat-icon>clear</mat-icon>
                    </button>
                </mat-form-field>
            </div>

            <div class="filter-group-secondary">
                <mat-form-field appearance="outline" class="filter-field" color="primary">
                    <mat-label>Filter by Type</mat-label>
                    <mat-select [(ngModel)]="selectedType" (selectionChange)="onTypeFilterChange()">
                        <mat-option *ngFor="let type of types" [value]="type.value">
                            {{ type.label }}
                        </mat-option>
                    </mat-select>
                    <mat-icon matPrefix>category</mat-icon>
                </mat-form-field>

                <div class="inactive-toggle-wrapper">
                    <mat-slide-toggle [(ngModel)]="showInactive" (change)="toggleShowInactive()" color="primary">
                        Show Inactive Only
                    </mat-slide-toggle>
                </div>
            </div>
        </div>

        <!-- Progress Overlay for global card consistency -->
        <div class="list-loading-overlay" *ngIf="loading">
            <mat-spinner diameter="40"></mat-spinner>
        </div>

        <!-- Error Message with Retry -->
        <div class="list-error-state" *ngIf="!loading && error">
            <mat-icon class="error-icon">error_outline</mat-icon>
            <p class="error-message">{{ error }}</p>
            <button mat-flat-button color="primary" (click)="retryLoadSuppliers()">
                <mat-icon>refresh</mat-icon>
                Retry
            </button>
        </div>

        <!-- Table Container -->
        <div class="table-wrapper" *ngIf="!error">
            <app-data-table 
                [data]="dataSource.data"
                [columns]="tableColumns"
                [totalItems]="totalSuppliers"
                [pageSize]="pageSize"
                [pageIndex]="pageIndex"
                [pageSizeOptions]="pageSizeOptions"
                (pageChange)="onPageChange($event)"
                (actionClick)="onTableAction($event)">
            </app-data-table>
        </div>
    </div>
</div>
