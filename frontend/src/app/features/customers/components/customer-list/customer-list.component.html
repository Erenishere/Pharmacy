<div class="list-page-container items-enhanced-page">
    <div class="list-page-header">
        <div class="header-content">
            <div class="title-with-accent">
                <div class="header-accent-bar"></div>
                <h1 class="page-title"><mat-icon>group</mat-icon> Customer Management</h1>
            </div>
            <p class="page-subtitle">Manage and organize all your clients and account titles (Total: {{ totalCustomers }})</p>
        </div>
        <div class="header-actions">
            <button mat-raised-button color="primary" (click)="openCreateCustomerDialog()" class="create-btn">
                <mat-icon>add</mat-icon>
                New Customer
            </button>
        </div>
    </div>

    <div class="list-page-card">
        <div class="list-filters-section">
            <div class="filter-group-primary">
                <mat-form-field class="search-field" appearance="outline" subscriptSizing="dynamic">
                    <mat-label>Search Customers</mat-label>
                    <input matInput [formControl]="searchControl" placeholder="Search by name, code or phone">
                    <mat-icon matPrefix>search</mat-icon>
                </mat-form-field>
            </div>

            <div class="filter-group-secondary">
                <mat-form-field appearance="outline" class="type-filter" subscriptSizing="dynamic">
                    <mat-label>Filter by Type</mat-label>
                    <mat-select [(value)]="selectedType" (selectionChange)="onTypeFilterChange($event.value)">
                        <mat-option value="">All Types</mat-option>
                        <mat-option *ngFor="let type of types" [value]="type">
                            {{ type | titlecase }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-slide-toggle [(ngModel)]="showDeleted" (change)="toggleShowDeleted()" color="primary">
                    Show Inactive
                </mat-slide-toggle>
            </div>
        </div>

        <div class="table-wrapper">
            <div *ngIf="loading" class="loading-overlay">
                <mat-spinner diameter="40"></mat-spinner>
            </div>

            <app-data-table 
                [data]="dataSource.data"
                [columns]="tableColumns"
                [totalItems]="totalCustomers"
                [pageSize]="pageSize"
                [pageIndex]="pageIndex"
                (pageChange)="onPageChange($event)"
                (actionClick)="onTableAction($event)">
            </app-data-table>
        </div>
    </div>
</div>
