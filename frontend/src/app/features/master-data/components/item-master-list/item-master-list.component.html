<div class="list-page-container items-enhanced-page">
  <div class="list-page-header">
    <div class="header-content">
      <h1 class="page-title"><mat-icon>inventory_2</mat-icon> Item Master Management</h1>
      <p class="page-subtitle">Manage complete catalog of pharmaceutical products (Total: {{ totalItems }})</p>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="addItem()" class="create-btn">
        <mat-icon>add</mat-icon> New Item
      </button>
      <button mat-flat-button class="p-btn-secondary" [matMenuTriggerFor]="exportMenu">
        <mat-icon>download</mat-icon> Export
      </button>
      <mat-menu #exportMenu="matMenu">
        <button mat-menu-item (click)="exportToExcel()">
          <mat-icon>table_view</mat-icon> Excel Report
        </button>
        <button mat-menu-item (click)="exportToPDF()">
          <mat-icon>picture_as_pdf</mat-icon> PDF Catalog
        </button>
      </mat-menu>
    </div>
  </div>

  <div class="list-page-card">
    <div class="list-filters-section">
      <div class="filter-group-primary">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Search Items</mat-label>
          <input matInput [(ngModel)]="filters.search" (input)="onSearch()" placeholder="Name, Code or Generic">
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
      </div>

      <div class="filter-group-secondary">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Manufacturer</mat-label>
          <mat-select [(ngModel)]="filters.companyId" (selectionChange)="onFilterChange()">
            <mat-option value="">All Companies</mat-option>
            <mat-option *ngFor="let company of companies" [value]="company._id">
              {{ company.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Category</mat-label>
          <mat-select [(ngModel)]="filters.categoryId" (selectionChange)="onFilterChange()">
            <mat-option value="">All Categories</mat-option>
            <mat-option *ngFor="let cat of categories" [value]="cat._id">
              {{ cat.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-icon-button class="p-icon-btn" (click)="refreshItems()" matTooltip="Refresh Catalog">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="loading-overlay" *ngIf="loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <app-data-table 
        [data]="items"
        [columns]="tableColumns"
        [pageSize]="pageSize"
        [totalItems]="totalItems"
        [pageSizeOptions]="[10, 25, 50, 100]"
        (pageChange)="onPageChange($event)"
        (actionClick)="onTableAction($event)">
      </app-data-table>
    </div>
  </div>
</div>
