<div class="auth-wrapper">
    <div class="auth-inner">
        <div class="card">
            <div class="card-body">
                <a routerLink="/login" class="brand-logo">
                    <h2 class="brand-text">Industraders</h2>
                </a>

                <h4 class="card-title">Forgot Password? 🔐</h4>
                <p class="card-text">Enter your admin email address and we'll send you a reset link.</p>

                <!-- Success state -->
                <div class="alert alert-success" *ngIf="successMessage">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    {{ successMessage }}
                </div>

                <form class="auth-login-form" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
                    <div class="form-group">
                        <label for="fp-email" class="form-label">Admin Email Address</label>
                        <input type="email" id="fp-email" class="form-control" formControlName="email"
                            placeholder="admin@example.com" autofocus autocomplete="email" />
                        <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
                            class="text-danger">
                            Please enter a valid email address.
                        </div>
                    </div>

                    <div class="alert alert-danger" *ngIf="errorMessage">
                        {{ errorMessage }}
                    </div>

                    <button type="submit" id="fp-submit-btn" class="btn-primary"
                        [disabled]="forgotForm.invalid || isLoading">
                        {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
                    </button>
                </form>

                <p class="back-to-login">
                    <a routerLink="/login">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                        Back to Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
