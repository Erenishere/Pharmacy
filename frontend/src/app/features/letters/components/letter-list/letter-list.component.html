<div class="list-page-container items-enhanced-page">
  <div class="list-page-header">
    <div class="header-content">
      <div class="title-with-accent">
        <div class="header-accent-bar"></div>
        <h1 class="page-title"><mat-icon>mail</mat-icon> Official Correspondence</h1>
      </div>
      <p class="page-subtitle">Manage formal letters, notices, and system communications (Total: {{ letters.length }})</p>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="openCreateDialog()" class="create-btn">
        <mat-icon>add</mat-icon> New Letter
      </button>
    </div>
  </div>

  <div class="list-page-card">
    <div class="list-filters-section">
      <div class="filter-group-primary">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Letter Type</mat-label>
          <mat-select [formControl]="typeFilter" (selectionChange)="loadLetters()">
            <mat-option value="">All Types</mat-option>
            <mat-option value="Employment">Employment</mat-option>
            <mat-option value="SupplierContract">Supplier Contract</mat-option>
            <mat-option value="CustomerAgreement">Customer Agreement</mat-option>
            <mat-option value="Other">Other</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Status</mat-label>
          <mat-select [formControl]="statusFilter" (selectionChange)="loadLetters()">
            <mat-option value="">All Statuses</mat-option>
            <mat-option value="Draft">Draft</mat-option>
            <mat-option value="Final">Final</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="filter-group-secondary">
        <button mat-icon-button (click)="loadLetters()" matTooltip="Refresh Letters">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="loading-overlay" *ngIf="loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <app-data-table 
        [data]="letters"
        [columns]="tableColumns"
        [pageSize]="10"
        [pageSizeOptions]="[10, 25, 50]"
        (actionClick)="onTableAction($event)">
      </app-data-table>
    </div>
  </div>
</div>
