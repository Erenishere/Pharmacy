<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Item - Redesigned</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .modal-overlay {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .modal {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid #e8ecf1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #7367f0 0%, #9055ff 100%);
            color: white;
        }

        .modal-header-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .modal-subtitle {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .modal-body {
            padding: 28px;
            overflow-y: auto;
            flex: 1;
        }

        .form-section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding-bottom: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #7367f0 0%, #9055ff 100%);
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(115, 103, 240, 0.4);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .required {
            color: #ef4444;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            background: #f8fafc;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #7367f0;
            background: white;
            box-shadow: 0 0 0 4px rgba(115, 103, 240, 0.1);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 18px;
        }

        .form-input.with-icon {
            padding-right: 44px;
        }

        .input-hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-group:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #7367f0;
        }

        .checkbox-label {
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .modal-footer {
            padding: 20px 28px;
            border-top: 1px solid #e8ecf1;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            background: #f8fafc;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-cancel {
            background: white;
            color: #64748b;
            border: 2px solid #e2e8f0;
        }

        .btn-cancel:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7367f0 0%, #9055ff 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(115, 103, 240, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(115, 103, 240, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 24px 0;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .modal {
                max-width: 100%;
                border-radius: 0;
            }

            .form-grid,
            .specs-grid {
                grid-template-columns: 1fr;
            }

            .modal-footer {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal">
            <!-- Header -->
            <div class="modal-header">
                <div class="modal-header-content">
                    <div class="modal-icon">📦</div>
                    <div>
                        <h2 class="modal-title">Create New Item</h2>
                        <p class="modal-subtitle">Add a new product to your inventory</p>
                    </div>
                </div>
                <button class="close-btn" onclick="alert('Close dialog')">×</button>
            </div>

            <!-- Body -->
            <div class="modal-body">
                <!-- Basic Information -->
                <div class="form-section">
                    <div class="section-title">Basic Information</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">
                                Item Name <span class="required">*</span>
                            </label>
                            <input type="text" class="form-input" placeholder="Enter item name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                Category <span class="required">*</span>
                            </label>
                            <select class="form-select" required>
                                <option value="">Select category</option>
                                <option>Tablets</option>
                                <option>Capsules</option>
                                <option>Syrup</option>
                                <option>Injection</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                Brand
                            </label>
                            <input type="text" class="form-input" placeholder="Enter brand name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                Manufacturer
                            </label>
                            <input type="text" class="form-input" placeholder="Enter manufacturer">
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Specifications -->
                <div class="form-section">
                    <div class="section-title">Specifications</div>
                    <div class="specs-grid">
                        <div class="form-group">
                            <label class="form-label">Barcode</label>
                            <div class="input-with-icon">
                                <input type="text" class="form-input with-icon" placeholder="Scan or enter">
                                <span class="input-icon">📷</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Pack Size</label>
                            <input type="number" class="form-input" placeholder="e.g., 1" value="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Unit of Measure</label>
                            <select class="form-select">
                                <option value="">Select unit</option>
                                <option>Box</option>
                                <option>Strip</option>
                                <option>Piece</option>
                                <option>Bottle</option>
                                <option>Vial</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Strength/Dosage</label>
                            <input type="text" class="form-input" placeholder="e.g., 500mg">
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Storage & Handling -->
                <div class="form-section">
                    <div class="section-title">Storage & Handling</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Storage Conditions</label>
                            <textarea class="form-textarea" placeholder="e.g., Store at room temperature, away from moisture and heat"></textarea>
                            <span class="input-hint">Describe optimal storage requirements</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Handling Instructions</label>
                            <textarea class="form-textarea" placeholder="e.g., Handle with care, avoid exposure to direct sunlight"></textarea>
                            <span class="input-hint">Special handling requirements if any</span>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Additional Options -->
                <div class="form-section">
                    <div class="section-title">Additional Options</div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
                        <div class="checkbox-group">
                            <input type="checkbox" id="prescription">
                            <label class="checkbox-label" for="prescription">Requires Prescription</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="temperature">
                            <label class="checkbox-label" for="temperature">Temperature Controlled</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="active" checked>
                            <label class="checkbox-label" for="active">Active Status</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="alert('Cancelled')">
                    Cancel
                </button>
                <button class="btn btn-primary" onclick="alert('Item Created!')">
                    <span>✓</span>
                    Create Item
                </button>
            </div>
        </div>
    </div>
</body>
</html>
